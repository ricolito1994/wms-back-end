user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    server_names_hash_bucket_size 128;

    include       mime.types;
    default_type  application/octet-stream;

    upstream laravel_backend {
        server wms-app-1:8000;
        server wms-app-2:8000;
    }

    include /etc/nginx/conf.d/*.conf;

    server {
        listen 80;
        server_name ec2-3-27-44-87.ap-southeast-2.compute.amazonaws.com;

        # Let's Encrypt challenge
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://laravel_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|map|txt|webp|avif)$ {
            root /var/www/html/public;
            try_files $uri =404;
            access_log off;
            expires max;
            add_header Cache-Control "public";
        }

        location ~ /\.ht {
            deny all;
        }
    }

    # Uncomment when HTTPS is ready
    # server {
    #     listen 443 ssl;
    #     server_name ec2-3-27-44-87.ap-southeast-2.compute.amazonaws.com;

    #     ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    #     root /var/www/html/public;
    #     index index.php;

    #     location ^~ /.well-known/acme-challenge/ {
    #         root /var/www/certbot;
    #     }

    #     location / {
    #         proxy_pass http://laravel_backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }

    #     location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|map|txt|webp|avif)$ {
    #         root /var/www/html/public;
