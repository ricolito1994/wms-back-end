http {
    server_names_hash_bucket_size 128;

    include       mime.types;
    default_type  application/octet-stream;

    # Other directives...
    include /etc/nginx/conf.d/*.conf;


    upstream laravel_backend {
        server wms-app-1:8000;
        server wms-app-2:8000;
    }

    server {
        listen 80;
        server_name ec2-3-27-44-87.ap-southeast-2.compute.amazonaws.com;

        # Serve static assets directly
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|map|txt|webp|avif)$ {
            root /var/www/html/public;
            try_files $uri =404;
            access_log off;
            expires max;
            add_header Cache-Control "public";
        }

        # Let's Encrypt challenge
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # All other requests go to Laravel Octane
        location / {
            proxy_pass http://laravel_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block .htaccess
        location ~ /\.ht {
            deny all;
        }
    }
}

