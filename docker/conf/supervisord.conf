[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
startsecs=3

[program:redis]
command=/usr/bin/redis-server
autostart=true
autorestart=true
priority=20
startsecs=3

[program:cron]
command=cron -f
autostart=true
autorestart=true
priority=25
startsecs=2

[program:queue]
command=php artisan queue:work --tries=3 --timeout=90
directory=/var/www
user=www-data
autostart=true
autorestart=true
priority=35
startsecs=3
stdout_logfile=/var/www/storage/logs/queue-worker.log
stderr_logfile=/var/www/storage/logs/queue-worker.err

[program:octane-8000]
command=php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000
directory=/var/www
user=www-data
autostart=true
autorestart=true
priority=30
startsecs=5
startretries=10
stdout_logfile=/var/www/storage/logs/octane-8000.log
stderr_logfile=/var/www/storage/logs/octane-8000.err

[program:octane-8001]
command=php artisan octane:start --server=swoole --host=0.0.0.0 --port=8001
directory=/var/www
user=www-data
autostart=true
autorestart=true
priority=30
startsecs=5
startretries=10
stdout_logfile=/var/www/storage/logs/octane-8001.log
stderr_logfile=/var/www/storage/logs/octane-8001.err

[program:octane-8002]
command=php artisan octane:start --server=swoole --host=0.0.0.0 --port=8002
directory=/var/www
user=www-data
autostart=true
autorestart=true
priority=30
startsecs=5
startretries=10
stdout_logfile=/var/www/storage/logs/octane-8002.log
stderr_logfile=/var/www/storage/logs/octane-8002.err
