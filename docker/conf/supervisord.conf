[supervisord]
nodaemon=true

[program:octane]
command=php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octane.log
stderr_logfile=/var/log/supervisor/octane.err.log

[program:queue]
command=php artisan queue:work --tries=3
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/queue.log
stderr_logfile=/var/log/supervisor/queue.err.log

[program:scheduler]
command=/bin/bash -c "while true; do php artisan schedule:run >> /var/log/supervisor/scheduler.log 2>&1; sleep 60; done"
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/scheduler.log
stderr_logfile=/var/log/supervisor/scheduler.err.log
