[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log

[program:octane_8000]
command=php artisan octane:start --server=swoole --host=127.0.0.1 --port=8000
directory=/var/www
autostart=true
autorestart=true
user=laravel
stdout_logfile=/var/log/octane_8000.log
stderr_logfile=/var/log/octane_8000.err.log

[program:octane_8001]
command=php artisan octane:start --server=swoole --host=127.0.0.1 --port=8001
directory=/var/www
autostart=true
autorestart=true
user=laravel
stdout_logfile=/var/log/octane_8001.log
stderr_logfile=/var/log/octane_8001.err.log

[program:octane_8002]
command=php artisan octane:start --server=swoole --host=127.0.0.1 --port=8002
directory=/var/www
autostart=true
autorestart=true
user=laravel
stdout_logfile=/var/log/octane_8002.log
stderr_logfile=/var/log/octane_8002.err.log

[program:queue]
command=php artisan queue:work --tries=3
directory=/var/www
autostart=true
autorestart=true
user=laravel
stdout_logfile=/var/log/queue.log
stderr_logfile=/var/log/queue.err.log

[program:cron]
command=cron -f
autostart=true
autorestart=true

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
