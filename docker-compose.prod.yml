version: "3.8"

services:
  wms-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: wms-app
    volumes:
       - .:/var/www:delegated
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    environment:
      - APP_ENV=production
    restart: unless-stopped
    tty: true